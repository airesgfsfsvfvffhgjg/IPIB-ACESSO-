<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controlo de Acesso</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#eaf1fb;--card:#fff;--tx:#14181f;--mut:#667085;--pri:#2b4a8f;--acc:#3f9b3f;--ok:#15803d;--bad:#b91c1c;--bd:#e3e6eb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.w{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding:12px;background:#2b4a8f;border-bottom:5px solid #3f9b3f;border-radius:14px}.top h1{color:#fff}.top button{background:#fff;color:#2b4a8f;border-color:#fff;font-weight:600}.hl{width:46px;height:46px;object-fit:contain;background:#fff;border-radius:10px;padding:2px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:14px}.tabs button{font-size:13px;padding:10px 2px}.pr{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd);font-size:15px}.pg{color:var(--ok)}.np{color:var(--bad)}.logo{max-height:70px;max-width:70%;display:block;margin:0 auto 8px;background:#fff;border-radius:12px;padding:4px}.ck{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}.ck label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--tx)}.ck input{width:auto;margin:0}
button,input,select{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 6px;cursor:pointer}
button.p{background:var(--pri);border-color:var(--pri);color:#fff}
button.on{background:#3f9b3f;border-color:#3f9b3f;color:#fff;font-weight:600}
input,select{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:4px 0 10px}
label,.mt{font-size:13px;color:var(--mut)}
.card{border-top:4px solid #3f9b3f!important;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--bd);flex:none}
.big{width:110px;height:110px;border-radius:14px;object-fit:cover;background:var(--bd)}
.grow{flex:1;min-width:0}.nm{font-weight:600;color:#2b4a8f}.cd{font-family:ui-monospace,Menlo,monospace;letter-spacing:2px;font-weight:700}
.ok{color:var(--ok)}.bad{color:var(--bad)}.hide{display:none!important}
.res{border-width:2px}.res.g{border-color:var(--ok)}.res.r{border-color:var(--bad)}
video{width:100%;border-radius:12px;background:#000;margin-bottom:10px}
.bar{height:10px;border-radius:5px;background:var(--pri);margin-top:4px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.cardd{background:#fff;color:#111;border-radius:16px;overflow:hidden;width:100%;max-width:320px;text-align:center;border:2px solid #2b4a8f}
.cardd .bn{background:#2b4a8f;height:72px}.cardd .fo{display:block;width:96px;height:96px;border-radius:50%;object-fit:cover;border:4px solid #fff;margin:-48px auto 0;background:#d9deea}
.cardd .bd{padding:0 16px 12px}.cardd .gv{background:#3f9b3f;color:#fff;padding:8px;font-size:13px;font-weight:600}.cardd svg{width:180px;height:180px;margin:8px 0}
.fw{display:block;overflow:hidden;background:var(--bd);flex:none}.fw img{width:100%;height:100%;object-fit:cover;display:block}.ph.fw{border-radius:50%}.big.fw{border-radius:14px}.mx{margin:8px auto}.fprevin{width:100%;height:100%}
.al{border-radius:12px;padding:10px;margin-top:12px;text-align:center;font-weight:700;color:#fff}.al.g{background:#3f9b3f}.al.r{background:#b91c1c}.al small{display:block;font-weight:400;font-size:12px}.cardd .al{margin:8px 0 0;font-size:13px}.sl{padding:0;margin:2px 0 8px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media print{body *{visibility:hidden}.cardd,.cardd *{visibility:visible}.cardd{position:absolute;left:0;top:0}}
</style>
</head>
<body>
<div class="w">
<div class="top"><div class="row"><img class="hl lg" alt=""><h1>Controlo de Acesso</h1></div><button id="sair" class="hide" onclick="sair()">Sair</button></div>

<div id="login" class="card">
  <img class="logo lg" alt="" style="max-height:110px">
  <label>E-mail</label><input id="em" type="email" autocomplete="username">
  <label>Senha</label><input id="pw" type="password" autocomplete="current-password">
  <button class="p" style="width:100%" onclick="entrar()">Entrar</button>
  <p class="mt bad" id="lerr"></p>
</div>

<div id="app" class="hide">
  <div class="tabs">
    <button id="t1" class="on" onclick="tab(1)">Entrada</button>
    <button id="t2" onclick="tab(2)">Alunos</button>
    <button id="t3" onclick="tab(3)">Novo</button>
    <button id="t4" onclick="tab(4)">Relatório</button>
    <button id="t5" onclick="tab(5)">Escola</button>
  </div>

  <div id="v1">
    <div class="card">
      <label>Código do aluno</label>
      <input id="cod" placeholder="Ex.: FGX580" autocapitalize="characters" style="text-transform:uppercase" onkeydown="if(event.key==='Enter')verificar()">
      <div class="g2"><button class="p" onclick="verificar()">Verificar</button><button onclick="scan()">Escanear QR</button></div>
    </div>
    <video id="vid" class="hide" playsinline muted></video>
    <div id="res"></div>
  </div>

  <div id="v2" class="hide">
    <input id="q" placeholder="Pesquisar nome, código, curso…" oninput="lista()">
    <div id="list"></div>
  </div>

  <div id="v3" class="hide"><div class="card">
    <div class="nm" id="ftit" style="margin-bottom:8px">Novo aluno</div>
    <label>Nome completo</label><input id="nome">
    <label>Nº de registo académico (opcional)</label><input id="reg">
    <div class="g2">
      <div><label>Classe</label><select id="classe"><option>7.ª</option><option>8.ª</option><option>9.ª</option><option>10.ª</option><option>11.ª</option><option>12.ª</option><option>13.ª</option></select></div>
      <div><label>Idade</label><input id="idade" type="number" min="10" max="40"></div>
    </div>
    <label>Curso</label><input id="curso" placeholder="Informática, Eletricidade…">
    <label>Turno</label><select id="turno"><option>Manhã</option><option>Tarde</option><option>Noite</option></select>
    <label>Foto (vazio = manter a atual)</label><input id="foto" type="file" accept="image/*" onchange="escolheFoto()">
    <div id="fprev" class="fw" style="width:130px;height:130px;border-radius:50%;margin:0 auto 8px"></div>
    <label>Zoom</label><input class="sl" id="fz" type="range" min="1" max="3" step="0.05" value="1" oninput="ajFoto()">
    <label>Posição horizontal</label><input class="sl" id="fx" type="range" min="0" max="100" value="50" oninput="ajFoto()">
    <label>Posição vertical</label><input class="sl" id="fy" type="range" min="0" max="100" value="50" oninput="ajFoto()">
    <div class="nm" style="margin:4px 0 8px">Comparticipação (por trimestre)</div><div class="ck" id="ck" style="grid-template-columns:1fr"></div>
    <div class="nm" style="margin:4px 0 8px">Folhas de prova pagas (7.ª a 12.ª)</div><div class="ck" id="fpck" style="grid-template-columns:1fr"></div>
    <button class="p" id="btnsalvar" style="width:100%" onclick="salvar()">Cadastrar e gerar código</button>
    <p class="mt" id="msg"></p>
  </div></div>

  <div id="v4" class="hide">
    <label>Data</label><input id="dia" type="date" onchange="relatorio()">
    <div id="rel"></div>
  </div>

  <div id="v5" class="hide"><div class="card">
    <div class="nm" style="margin-bottom:8px">Dados da escola</div>
    <label>Nome da instituição</label><input id="escnome">
    <label>Polo</label><input id="escpolo" placeholder="Ex.: Benguela">
    <label>Ano letivo</label><input id="escano" placeholder="2026/27">
    <div class="nm" style="margin:6px 0">Trimestres (início e fim)</div><div id="trbox"></div>
    <div class="nm" style="margin:10px 0 4px">Provas (folha de prova)</div>
    <p class="mt">O aviso aparece 14 dias antes do início e desaparece depois do fim. Ponha como fim o último dia em que algum aluno faz prova.</p>
    <div id="prbox"></div><button onclick="addProva()" style="width:100%;margin-bottom:10px">+ Adicionar período de provas</button>
    <label>Logótipo (vazio = logótipo do IPIB)</label><input id="logof" type="file" accept="image/*">
    <div id="prevl"></div>
    <button class="p" style="width:100%" onclick="salvarEscola()">Guardar</button>
    <p class="mt" id="emsg"></p>
  </div></div>
</div>
</div>

<div id="modal" class="hide" onclick="if(event.target===this)fechar()"><div>
  <div class="cardd" id="cartao"></div>
  <div class="g2" id="acoes" style="margin-top:10px"></div>
  <div class="g2" style="margin-top:8px"><button onclick="window.print()">Imprimir</button><button onclick="fechar()">Fechar</button></div>
</div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,updateDoc,query,where} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyA4NBJ85Nmgwr49vtDc2bAXYgfch3Vflfk",
  authDomain:"ipib-acesso.firebaseapp.com",
  projectId:"ipib-acesso",
  storageBucket:"ipib-acesso.firebasestorage.app",
  messagingSenderId:"1070987462741",
  appId:"1:1070987462741:web:81ce700d21a8cebfb4ecdc"});
const auth=getAuth(app),db=getFirestore(app);
const $=i=>document.getElementById(i);
const esc=s=>{const d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML};
const hoje=()=>new Date().toLocaleDateString("sv-SE");
const hora=()=>new Date().toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"});
const AB="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",ANO="2026/27";
let alunos=[],stream=null,rodando=false;
const W=(n,f)=>window[n]=f;

W("entrar",async()=>{
  $("lerr").textContent="";
  try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value)}
  catch(e){$("lerr").textContent="E-mail ou senha incorretos."}
});
W("sair",()=>signOut(auth));
onAuthStateChanged(auth,u=>{
  $("login").classList.toggle("hide",!!u);$("app").classList.toggle("hide",!u);$("sair").classList.toggle("hide",!u);
  if(u){$("dia").value=hoje();carregar()}
});
W("tab",n=>{
  if(n!==3&&EDIT)limparForm();for(let i=1;i<=5;i++){$("v"+i).classList.toggle("hide",i!==n);$("t"+i).classList.toggle("on",i===n)}
  if(n!==1)parar();if(n===4)relatorio()
});

async function carregar(){
  const s=await getDocs(collection(db,"students"));
  alunos=s.docs.map(d=>d.data()).sort((a,b)=>a.nome.localeCompare(b.nome));lista();
  try{const e=await getDoc(doc(db,"config","escola"));if(e.exists())ESC=e.data()}catch(e){}
  ESC.trim=ESC.trim||TRIM0;ESC.provas=ESC.provas||[];ESC.ano=ESC.ano||ANO;
  $("escnome").value=ESC.nome||"";$("escpolo").value=ESC.polo||"";$("escano").value=ESC.ano;desenhaEsc();montaCk();montaFp();prevL()
}
function novoCodigo(){let c;do{c="";for(let i=0;i<6;i++)c+=AB[Math.floor(Math.random()*AB.length)]}while(alunos.some(a=>a.codigo===c));return c}
const reduzir=f=>new Promise(res=>{
  if(!f)return res("");const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.8))};
    im.onerror=()=>res("");im.src=r.result};r.onerror=()=>res("");r.readAsDataURL(f)});

const LOGO=()=>ESC.logo||LOGO0;
const TRIM0=[{ini:"2026-09-01",fim:"2026-11-30"},{ini:"2026-12-01",fim:"2027-02-28"},{ini:"2027-03-01",fim:"2027-06-30"}];
const dd=d=>d?d.split("-").reverse().join("/"):"—";
const foto=(a,cls)=>`<span class="fw ${cls}">${a.foto?`<img src="${a.foto}" alt="" style="object-position:${a.fx??50}% ${a.fy??50}%;transform:scale(${a.fz||1});transform-origin:${a.fx??50}% ${a.fy??50}%">`:""}</span>`;
const dias=(d,n)=>{const x=new Date(d+"T00:00:00");x.setDate(x.getDate()+n);return x.toLocaleDateString("sv-SE")};
const avisos=a=>{const n=parseInt(a.classe);if(n<7||n>12)return"";const h=hoje();
  return (ESC.provas||[]).filter(p=>p.ini&&p.fim&&h>=dias(p.ini,-14)&&h<=p.fim).map(p=>{const ok=a.fp&&a.fp[p.id];return `<div class="al ${ok?"g":"r"}">${ok?"✔ Folha de prova paga":"⚠ Folha de prova NÃO paga"}<small>${esc(p.nome)} · ${dd(p.ini)} a ${dd(p.fim)}</small></div>`}).join("")};
let EDIT=null,FT="",ESC={nome:"",polo:"",logo:"",ano:ANO,trim:TRIM0,provas:[]};
const ciclo=c=>parseInt(c)<=9?"1.º Ciclo":"2.º Ciclo";
function montaCk(p){$("ck").innerHTML=ESC.trim.map((t,i)=>`<label><input type="checkbox" id="pm${i}" ${p&&p[i]?"checked":""}>${i+1}.º Trimestre (${dd(t.ini)} – ${dd(t.fim)})</label>`).join("")}
function montaFp(f){$("fpck").innerHTML=ESC.provas.length?ESC.provas.map((p,i)=>`<label><input type="checkbox" id="fp${i}" ${f&&f[p.id]?"checked":""}>${esc(p.nome)}</label>`).join(""):'<span class="mt">Sem períodos de provas (veja a aba Escola).</span>'}
montaCk();
function limparForm(){["nome","idade","curso","foto","reg"].forEach(i=>$(i).value="");montaCk();montaFp();FT="";$("fz").value=1;$("fx").value=50;$("fy").value=50;ajFoto();EDIT=null;$("ftit").textContent="Novo aluno";$("btnsalvar").textContent="Cadastrar e gerar código";$("msg").textContent=""}
W("escolheFoto",async()=>{FT=await reduzir($("foto").files[0]);ajFoto()});
W("ajFoto",()=>{$("fprev").innerHTML=FT?foto({foto:FT,fz:$("fz").value,fx:$("fx").value,fy:$("fy").value},"fprevin"):""});
const qa=v=>esc(v||"").replace(/"/g,"&quot;");
function desenhaEsc(){
  $("trbox").innerHTML=ESC.trim.map((t,i)=>`<div class="row2"><div><label>${i+1}.º Trim. – início</label><input type="date" id="ti${i}" value="${t.ini}"></div><div><label>fim</label><input type="date" id="tf${i}" value="${t.fim}"></div></div>`).join("");
  $("prbox").innerHTML=ESC.provas.map((p,i)=>`<div class="card" style="padding:10px"><label>Nome</label><input id="pn${i}" value="${qa(p.nome)}"><div class="row2"><div><label>Início</label><input type="date" id="pi${i}" value="${p.ini}"></div><div><label>Fim (último aluno)</label><input type="date" id="pf${i}" value="${p.fim}"></div></div><button onclick="delProva(${i})">Remover</button></div>`).join("")}
function lerEsc(){ESC.trim=ESC.trim.map((t,i)=>({ini:$("ti"+i).value,fim:$("tf"+i).value}));ESC.provas=ESC.provas.map((p,i)=>({id:p.id,nome:$("pn"+i).value.trim(),ini:$("pi"+i).value,fim:$("pf"+i).value}))}
W("addProva",()=>{lerEsc();ESC.provas.push({id:"p"+Date.now(),nome:"Provas do "+(ESC.provas.length+1)+".º Trimestre",ini:"",fim:""});desenhaEsc()});
W("delProva",i=>{lerEsc();ESC.provas.splice(i,1);desenhaEsc()});
const reduzirLogo=f=>new Promise(res=>{if(!f)return res("");const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,300/im.width),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/png"))};im.onerror=()=>res("");im.src=r.result};r.onerror=()=>res("");r.readAsDataURL(f)});
function prevL(){$("prevl").innerHTML=ESC.logo?`<img class="logo" src="${ESC.logo}" alt="">`:""}
W("salvarEscola",async()=>{
  lerEsc();const logo=await reduzirLogo($("logof").files[0]);
  ESC={...ESC,nome:$("escnome").value.trim(),polo:$("escpolo").value.trim(),ano:$("escano").value.trim()||ANO,logo:logo||ESC.logo||""};
  try{await setDoc(doc(db,"config","escola"),ESC);$("emsg").textContent="Guardado.";$("logof").value="";prevL();montaCk();montaFp()}catch(e){$("emsg").textContent="Erro ao guardar."}
});
W("salvar",async()=>{
  const n=$("nome").value.trim(),cu=$("curso").value.trim();
  if(!n||!cu){$("msg").textContent="Preencha nome e curso.";return}
  $("msg").textContent="A guardar…";
  const ant=EDIT?alunos.find(x=>x.codigo===EDIT):null;
  const fp={};ESC.provas.forEach((p,i)=>{fp[p.id]=!!($("fp"+i)&&$("fp"+i).checked)});
  const a={...(ant||{codigo:novoCodigo(),ativo:true,ano:ESC.ano||ANO,criado:new Date().toISOString()}),nome:n,classe:$("classe").value,idade:Number($("idade").value)||0,curso:cu,turno:$("turno").value,reg:$("reg").value.trim(),pt:ESC.trim.map((_,i)=>$("pm"+i).checked),fp,foto:FT,fz:Number($("fz").value),fx:Number($("fx").value),fy:Number($("fy").value)};
  try{await setDoc(doc(db,"students",a.codigo),a)}catch(e){$("msg").textContent="Erro ao guardar. Verifique as regras do Firestore.";return}
  if(ant)Object.assign(ant,a);else alunos.push(a);
  limparForm();lista();tab(2);if(!ant)cartao(a.codigo)
});
W("editar",cod=>{
  const a=alunos.find(x=>x.codigo===cod);if(!a)return;
  EDIT=cod;$("nome").value=a.nome;$("classe").value=a.classe;$("idade").value=a.idade||"";$("curso").value=a.curso;$("turno").value=a.turno;$("reg").value=a.reg||"";montaCk(a.pt);montaFp(a.fp);
  FT=a.foto||"";$("fz").value=a.fz||1;$("fx").value=a.fx??50;$("fy").value=a.fy??50;ajFoto();
  $("ftit").textContent="Editar aluno";$("btnsalvar").textContent="Guardar alterações";fechar();tab(3)
});
const ficha=a=>{const p=a.pt||[];
  const lin=(k,v)=>`<div class="pr"><span>${k}</span><b>${esc(v)}</b></div>`;
  return `<div style="text-align:center"><img class="logo" src="${LOGO()}" alt="">${ESC.nome?`<div class="nm">${esc(ESC.nome)}</div>`:""}<div class="mt">Consulta QR Code</div>${a.foto?foto(a,"big mx"):""}<div class="nm" style="font-size:18px">${esc(a.nome)}</div><div class="mt">Registo Académico: <b>${esc(a.reg||a.codigo)}</b></div><div class="nm ${a.ativo?"ok":"bad"}">${a.ativo?"ATIVO":"BLOQUEADO"}</div></div>${avisos(a)}
  <div class="nm" style="margin-top:14px">Dados Académicos</div>${lin("Classe",a.classe)}${lin("Ciclo",ciclo(a.classe))}${lin("Curso",a.curso)}${lin("Turno",a.turno)}${lin("Idade",a.idade?a.idade+" anos":"—")}${lin("Ano Letivo",a.ano)}${lin("Polo",ESC.polo||"—")}
  <div class="nm" style="margin-top:14px">Situação Financeira</div>${(ESC.trim||[]).map((t,i)=>`<div class="pr"><span>${i+1}.º Trimestre<br><span class="mt">${dd(t.ini)} – ${dd(t.fim)}</span></span><b class="${p[i]?"pg":"np"}">${p[i]?"Pago":"Não pago"}</b></div>`).join("")}`};
W("lista",()=>{
  const q=$("q").value.toLowerCase();let h="";
  const f=alunos.filter(a=>(a.nome+a.codigo+a.curso+a.classe).toLowerCase().includes(q));
  if(!f.length)h='<p class="mt">Nenhum aluno encontrado.</p>';
  f.forEach(a=>{h+=`<div class="card row" onclick="cartao('${a.codigo}')">${foto(a,"ph")}<div class="grow"><div class="nm">${esc(a.nome)}</div><div class="mt">${esc(a.classe)} · ${esc(a.curso)} · ${esc(a.turno)}</div></div><div style="text-align:right"><div class="cd">${esc(a.codigo)}</div><div class="mt ${a.ativo?"ok":"bad"}">${a.ativo?"Ativo":"Bloqueado"}</div></div></div>`});
  $("list").innerHTML=h
});
W("cartao",cod=>{
  const a=alunos.find(x=>x.codigo===cod);if(!a)return;
  const qr=qrcode(0,"M");qr.addData(a.codigo);qr.make();
  $("cartao").innerHTML=`<div class="bn"></div><div class="bd">${foto(a,"fo")}<div style="font-weight:700;margin-top:6px">${esc(a.nome)}</div><div>${qr.createSvgTag(4,0)}</div><div class="cd" style="font-size:22px;color:#2b4a8f">${esc(a.codigo)}</div>${avisos(a)}</div><div class="gv">Ano letivo ${esc(a.ano)}</div>`;
  $("acoes").innerHTML=`<button onclick="alternar('${a.codigo}')">${a.ativo?"Bloquear código":"Reativar código"}</button><button onclick="editar('${a.codigo}')">Editar</button>`;
  $("modal").classList.remove("hide")
});
W("alternar",async cod=>{
  const a=alunos.find(x=>x.codigo===cod);a.ativo=!a.ativo;
  await updateDoc(doc(db,"students",cod),{ativo:a.ativo});lista();cartao(cod)
});
W("fechar",()=>$("modal").classList.add("hide"));

W("verificar",async(c)=>{
  const cod=(typeof c==="string"?c:$("cod").value).trim().toUpperCase();if(!cod)return;
  parar();$("res").innerHTML='<p class="mt">A verificar…</p>';
  let a;try{const s=await getDoc(doc(db,"students",cod));a=s.exists()?s.data():null}catch(e){$("res").innerHTML='<div class="card res r bad nm">Erro de ligação.</div>';return}
  if(!a){$("res").innerHTML=`<div class="card res r"><div class="nm bad">Código não encontrado</div><div class="cd">${esc(cod)}</div></div>`;return}
  const info=ficha(a);
  if(!a.ativo){$("res").innerHTML=`<div class="card res r"><div class="nm bad" style="text-align:center">⛔ ACESSO BLOQUEADO</div>${info}</div>`;return}
  const id=hoje()+"_"+a.codigo,ref=doc(db,"entradas",id);let st;
  try{const e=await getDoc(ref);
    if(e.exists())st=`<div class="nm" style="color:#b45309">Já registado hoje às ${esc(e.data().hora)}</div>`;
    else{await setDoc(ref,{data:hoje(),hora:hora(),codigo:a.codigo,nome:a.nome,classe:a.classe,curso:a.curso,turno:a.turno});st='<div class="nm ok">✔ Entrada registada</div>'}
  }catch(e){st='<div class="nm bad">Não foi possível registar</div>'}
  $("res").innerHTML=`<div class="card res g">${st}${info}</div>`;$("cod").value=""
});

W("scan",async()=>{
  if(!("BarcodeDetector" in window)){$("res").innerHTML='<p class="mt">Este navegador não lê QR. Use o Chrome ou digite o código.</p>';return}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})}catch(e){$("res").innerHTML='<p class="mt">Sem acesso à câmara.</p>';return}
  const v=$("vid");v.srcObject=stream;v.classList.remove("hide");await v.play();rodando=true;
  const det=new BarcodeDetector({formats:["qr_code"]});
  const loop=async()=>{if(!rodando)return;try{const r=await det.detect(v);if(r.length){verificar(r[0].rawValue);return}}catch(e){}setTimeout(loop,250)};loop()
});
function parar(){rodando=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$("vid").classList.add("hide")}

W("relatorio",async()=>{
  const d=$("dia").value||hoje();$("rel").innerHTML='<p class="mt">A carregar…</p>';
  let es;try{es=(await getDocs(query(collection(db,"entradas"),where("data","==",d)))).docs.map(x=>x.data())}catch(e){$("rel").innerHTML='<p class="bad">Erro ao carregar.</p>';return}
  const grupo=(f)=>{const m={};es.forEach(e=>{const k=f(e);m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  const bloco=(t,arr)=>{const mx=arr.length?arr[0][1]:1;return `<div class="card"><div class="nm">${t}</div>`+(arr.length?arr.map(([k,n])=>`<div style="margin-top:8px"><div class="row"><span class="grow">${esc(k)}</span><b>${n}</b></div><div class="bar" style="width:${Math.max(4,n/mx*100)}%"></div></div>`).join(""):'<p class="mt">Sem dados.</p>')+"</div>"};
  $("rel").innerHTML=`<div class="card"><div class="mt">Entradas em ${esc(d)}</div><div style="font-size:36px;font-weight:700">${es.length}</div><div class="mt">alunos de ${alunos.length} cadastrados</div></div>`+
    bloco("Por turma (mais alunos primeiro)",grupo(e=>`${e.classe} ${e.curso} · ${e.turno}`))+bloco("Por curso",grupo(e=>e.curso))+bloco("Por turno",grupo(e=>e.turno))
});
</script>
</body>
